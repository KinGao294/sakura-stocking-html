<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" href="data:,">
<title>Sheer Knit · stretch toy</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: none; touch-action: none; }
  /* soft cinematic vignette */
  #vig { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 75% 85% at 52% 48%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }
  #grain { position: fixed; inset: -50%; pointer-events: none; opacity: .035; mix-blend-mode: screen; background-repeat: repeat;
    animation: grain 0.6s steps(4) infinite; }
  @keyframes grain { 0%{transform:translate(0,0)} 25%{transform:translate(-3%,2%)} 50%{transform:translate(2%,-3%)} 75%{transform:translate(-2%,-1%)} 100%{transform:translate(0,0)} }
  #hint { position: fixed; left: 50%; bottom: 6.5vh; transform: translateX(-50%); pointer-events: none;
    font: 300 15px/1.4 "PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
    letter-spacing: .35em; color: rgba(235,228,226,.62); text-shadow: 0 0 12px rgba(0,0,0,.9);
    transition: opacity 1.4s ease; opacity: 0; white-space: nowrap; }
  #hint.show { opacity: 1; }
  #hint::before { content: ""; display: inline-block; width: 26px; height: 1px; background: rgba(235,228,226,.4); vertical-align: middle; margin-right: 14px; }
  #hint::after  { content: ""; display: inline-block; width: 26px; height: 1px; background: rgba(235,228,226,.4); vertical-align: middle; margin-left: 4px; }
  /* custom pinch cursor */
  #cur { position: fixed; left: 0; top: 0; width: 0; height: 0; pointer-events: none; z-index: 5; opacity: 0; transition: opacity .3s; }
  #cur.on { opacity: 1; }
  #cur .ring { position: absolute; left: -14px; top: -14px; width: 26px; height: 26px; border-radius: 50%;
    border: 1px solid rgba(255,250,248,.55); transition: transform .18s ease, border-color .2s, background .2s; }
  #cur .dot  { position: absolute; left: -2px; top: -2px; width: 4px; height: 4px; border-radius: 50%; background: rgba(255,250,248,.85); }
  #cur.hot .ring { transform: scale(1.35); border-color: rgba(255,250,248,.85); }
  #cur.grab .ring { transform: scale(.55); border-color: rgba(255,255,255,.95); background: rgba(255,255,255,.08); }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: #aaa;
    font: 14px/1.6 sans-serif; text-align: center; padding: 2em; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="grain"></div>
<div id="hint">按住并拖动丝袜</div>
<div id="cur"><div class="ring"></div><div class="dot"></div></div>
<div id="err">此页面需要 WebGL2。<br>This demo needs a browser with WebGL2 enabled.</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
